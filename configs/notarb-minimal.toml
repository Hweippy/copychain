[launcher]
task="onchain-bot"
jvm_args=[
    "-server",
    "-Xmx4096m"
]

[notarb]
acknowledge_terms_of_service=true

[user]
keypair_path="${DEFAULT_KEYPAIR_PATH}"
protect_keypair=true

[token_accounts_checker]
rpc_url="${DEFAULT_RPC_URL}"
delay_seconds=3

[blockhash_updater]
rpc_url="${DEFAULT_RPC_URL}"
delay_ms=1000

[market_loader]
rpc_url="${DEFAULT_RPC_URL}"

[lookup_table_loader]
rpc_url="${DEFAULT_RPC_URL}"

[transaction_executor]
threads=-1 # 0 will use a dynamic cached thread pool, -1 will use a thread per task, anything > 0 will use a fixed thread pool

[wsol_unwrapper]
enabled=false
reader_rpc_url="${DEFAULT_RPC_URL}"
sender_rpc_urls=["${DEFAULT_RPC_URL}"]

[[spam_rpc]]
id="rpc-1"
url="${DEFAULT_RPC_URL}"
max_idle_connections=1

[[spam_rpc]]
id="helius"
url="https://sender.helius-rpc.com/fast?swqos_only=true"
max_idle_connections=2
tip_meta={ type="HELIUS" }

[jito]
ips_file_path="" # required for proxy senders (.txt file with 1 ip/proxy per line)
prefunded_keypairs_path="" # optional - only for proxy senders (.txt file with 1 keypair per line)

[[jito.rpc]]
id="jito-1"
uuid="" # leave empty if you have none - use cautiously, sends are not automatically rate limited like the jupiter bot
regions=["singapore", "ny", "slc", "london", "frankfurt", "amsterdam", "tokyo", "dublin"] # each region will be sent to concurrently

[[swap]]
enabled=true
mint="SOL"

[swap.strategy_defaults]
meteora_bin_limit=20 # default 20 - helps keep cu down on high liquidity markets
flash_loan=true

# ---------------
# SPAM
[[swap.strategy]]
enabled = true
min_priority_fee_lamports=0
max_priority_fee_lamports=0
spam_senders=[
    { rpc="rpc-1", max_retries=0 },
]

# ---------------
# JITO
[[swap.strategy]]
enabled = true
min_jito_tip_lamports=0
max_jito_tip_lamports=0

# ---------------
# VENDORS
[[swap.strategy]]
enabled=true
min_spam_tip_lamports=0
max_spam_tip_lamports=0
min_priority_fee_lamports=0
max_priority_fee_lamports=0
require_profit=true
spam_senders=[
    { rpc="helius-fast", max_retries=0, skip_preflight=true },
]
